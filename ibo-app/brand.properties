# =====================================================================
#  إعدادات البراند — كنعاني
#  أي تعديل هون بيطبق على التطبيق كامل بعد ما تعمل Build جديد.
# =====================================================================

# اسم التطبيق اللي بيظهر تحت الأيقونة وبقائمة التطبيقات
BRAND_APP_NAME=Kanaani

# معرّف التطبيق (Package). لا تغيّره بعد ما توزّع التطبيق على الزباين،
# لأنه أي تغيير بيخلّي التطبيق ينزل كتطبيق جديد مش كتحديث.
BRAND_APP_ID=com.kanaani.tv.ibo

# رابط هوست Xtream. لما يكون معبّى، شاشة الدخول بتطلب يوزر وباسورد بس،
# وبتختفي خيارات M3U وStalker والكلاود. اتركه فاضي إذا بدك التطبيق مفتوح لأي هوست.
BRAND_HOST=http://amlive.cc

# الاسم اللي بيظهر للاشتراك جوا التطبيق
BRAND_PROVIDER_NAME=كنعاني

# رابط فحص التحديثات (ملف update.json اللي الـ workflow بينشره مع كل ريليز). فاضي = بدون تحديثات تلقائية.
# لازم الريبو يكون عام عشان الزباين يوصلوله.
BRAND_UPDATE_URL=https://github.com/Emad1995kanaan/kannni-tv/releases/latest/download/update.json

# إعلانات ثيمات الصفحة الرئيسية (ملف ads.json بمجلد ads بالريبو). فاضي = بدون إعلانات.
BRAND_ADS_URL=https://raw.githubusercontent.com/Emad1995kanaan/kannni-tv/main/ads/ads.json

# رسائل فورية للزباين (شريط تحت الشاشة) عن طريق ntfy.
# اسم القناة السري مش هون (الريبو عام): بيجي من Secret اسمه MSG_TOPIC وقت البناء.
BRAND_MSG_SERVER=https://ntfy.sh
