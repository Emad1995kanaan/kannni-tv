# اسم التطبيق اللي بيظهر تحت الأيقونة وبقائمة التطبيقات
BRAND_APP_NAME=Kanaani

# معرّف التطبيق (Package). لا تغيّره بعد ما توزّع التطبيق على الزباين،
# لأنه أي تغيير بيخلّي التطبيق ينزل كتطبيق جديد مش كتحديث.
BRAND_APP_ID=com.kanaani.tv.ibo

# رابط هوست Xtream. لما يكون معبّى، شاشة الدخول بتطلب يوزر وباسورد بس،
# وبتختفي خيارات M3U وStalker والكلاود. اتركه فاضي إذا بدك التطبيق مفتوح لأي هوست.
BRAND_HOST=http://amlive.cc

# الهوستات الاحتياط (مفصولة بفاصلة)، بالترتيب: إذا الرئيسي ما ردّ أو رفض الحساب، التطبيق بيجرب اللي بعده لحاله
BRAND_BACKUP_HOST=http://lyvanta.store:80,http://aro-analytics.com:80,http://8ksh1856.site:8080,http://bhsat8kkap.site:8080,http://var21.com:80,http://baghdadi.fun:80,http://s1.1234.ninja:80,http://baghdadi.store:80,http://kanaani.site:80

# الاسم اللي بيظهر للاشتراك جوا التطبيق
