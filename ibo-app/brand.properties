# رابط فحص التحديثات (ملف update.json اللي الـ workflow بينشره مع كل ريليز). فاضي = بدون تحديثات تلقائية.
# لازم الريبو يكون عام عشان الزباين يوصلوله.
BRAND_UPDATE_URL=https://github.com/Emad1995kanaan/kannni-tv/releases/latest/download/update.json

# إعلانات ثيمات الصفحة الرئيسية (ملف ads.json بمجلد ads بالريبو). فاضي = بدون إعلانات.
